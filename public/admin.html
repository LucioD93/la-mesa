<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a2c" />
    <meta name="robots" content="noindex" />
    <title>La Mesa admin</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="admin">
    <form id="login" class="admin-login" hidden>
      <h1>La Mesa admin</h1>
      <input id="password" class="input" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
      <button class="btn primary block">Sign in</button>
      <p id="loginError" class="admin-error" role="alert" hidden></p>
    </form>

    <main id="dash" class="admin-dash" hidden>
      <header class="admin-head">
        <h1>La Mesa admin</h1>
        <span id="updated" class="muted"></span>
        <button id="signOut" class="btn ghost" type="button">Sign out</button>
      </header>
      <p id="stale" class="admin-error" role="alert" hidden></p>

      <section>
        <h2>Right now</h2>
        <div class="admin-tiles">
          <div class="admin-tile"><span class="muted">In voice</span><b id="liveVoice"></b><small id="liveRooms" class="muted"></small></div>
          <div class="admin-tile"><span class="muted">Online</span><b id="liveOnline"></b><small id="liveMatches" class="muted"></small></div>
        </div>
      </section>

      <section id="metered" hidden>
        <h2>TURN relay this billing cycle, from Metered</h2>
        <div class="admin-chart">
          <p id="meteredError" class="admin-error" role="alert" hidden>Could not get usage from Metered.</p>
          <div id="meteredUsage">
            <div class="admin-quota"><b id="meteredUsed"></b><span id="meteredQuota" class="muted"></span></div>
            <div class="admin-meter"><i id="meteredBar"></i></div>
            <p id="meteredWarning" class="admin-error" hidden></p>
            <div id="meteredDays"></div>
          </div>
        </div>
      </section>

      <section>
        <h2>Activity (days in UTC)</h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th></th><th>Today</th><th>7 days</th><th>30 days</th><th>All time</th></tr></thead>
            <tbody id="periods"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>Services</h2>
        <div class="admin-table-wrap">
          <table class="admin-table admin-services"><tbody id="services"></tbody></table>
        </div>
      </section>
    </main>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
