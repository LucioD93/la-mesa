<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a2c" />
    <title>La Mesa</title>
    <meta name="description" content="Dominoes, Venezuelan truco, caída, parchís, roba la cochina, rummy or Rummikub for 4 players, 2 vs 2. No sign-up: send the link and play." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La Mesa" />
    <meta property="og:title" content="La Mesa" />
    <meta property="og:description" content="Dominoes, Venezuelan truco, caída, parchís, roba la cochina, rummy or Rummikub for 4 players, 2 vs 2. No sign-up: send the link and play." />
    <meta property="og:url" content="https://jugar.la-mesa.workers.dev/" />
    <meta property="og:image" content="https://jugar.la-mesa.workers.dev/og-image.png" />
    <meta property="og:image:secure_url" content="https://jugar.la-mesa.workers.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A domino tile and a Spanish playing card on a green felt table, with the words La Mesa" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Paint in the last theme right away; the match's own arrives with its state. -->
    <script>document.documentElement.dataset.theme = localStorage.getItem('domino.theme') || 'felt';</script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="landing">
    <main class="landing-card">
      <button id="langBtn" class="icon-btn small lang-btn" data-lang-btn data-i18n-aria="aria.lang">EN</button>
      <div class="logo" aria-hidden="true">
        <div class="tile v big"><span class="half p6"></span><span class="bar"></span><span class="half p3"></span></div>
        <span class="card big" data-card="1-e"></span>
      </div>
      <h1>La Mesa</h1>
      <p class="sub" data-i18n="landing.sub">4 players · 2 vs 2 · no sign-up</p>

      <div class="identity name-field">
        <div class="photo-field">
          <button type="button" id="photoBtn" class="photo-btn" aria-label="Take a picture for your avatar" data-i18n-aria="aria.photo"><span aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
          <button type="button" id="photoClear" class="photo-clear" aria-label="Remove your picture" data-i18n-aria="aria.photoClear" hidden>×</button>
          <input id="photoInput" type="file" accept="image/*" hidden />
        </div>
        <label class="field">
          <span data-i18n="landing.name">Your name</span>
          <input id="nameInput" maxlength="24" autocomplete="nickname" enterkeyhint="done" placeholder="Pick a name" data-i18n-placeholder="landing.namePlaceholder" />
        </label>
      </div>

      <button id="newMatch" class="btn primary block" data-i18n="landing.new">New match</button>

      <form id="joinForm" class="join">
        <input id="joinId" placeholder="Match code" data-i18n-placeholder="landing.code" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button class="btn" data-i18n="landing.join">Join</button>
      </form>

      <ul class="game-chips" id="gameChips"></ul>
      <p class="hint" data-i18n="landing.hint">Pick the game in the lobby, send the link, and fill empty seats with bots.</p>
    </main>

    <script type="module">
      import { halfHTML } from '/js/tiles.js';
      import { cardSVG, parseKey } from '/js/cards.js';
      import * as i18n from '/js/i18n.js';
      import * as avatar from '/js/avatar.js';
      import { GAMES } from '/js/games.js';
      // The games, in the lobby's order; names follow the language.
      document.getElementById('gameChips').innerHTML = GAMES.map(
        (id) => `<li data-g="${id}"><i aria-hidden="true"></i><span data-i18n="game.${id}"></span></li>`,
      ).join('');
      i18n.apply();
      document.getElementById('langBtn').onclick = () => i18n.cycle();
      document.querySelectorAll('.logo .half').forEach((h) => {
        h.outerHTML = halfHTML(Number(h.className.match(/p(\d)/)[1]), false);
      });
      document.querySelectorAll('.logo .card').forEach((c) => {
        c.innerHTML = cardSVG(parseKey(c.dataset.card));
      });

      // Venezuelan food. Plain ASCII so the codes survive the join form's [a-z0-9-] filter.
      const words = [
        'arepa', 'empanada', 'cachapa', 'hallaca', 'tequeno', 'pabellon', 'tajada', 'caraota', 'perico',
        'casabe', 'mandoca', 'bollito', 'pastelito', 'cachito', 'golfeado', 'quesillo', 'bienmesabe',
        'majarete', 'catalina', 'cocada', 'chicha', 'papelon', 'patacon', 'mondongo', 'polvorosa',
      ];
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      // The game page reads the same key, so the name follows you into every match.
      const nameInput = document.getElementById('nameInput');
      nameInput.value = localStorage.getItem('domino.name') || '';
      const saveName = () => {
        const v = nameInput.value.trim().slice(0, nameInput.maxLength);
        if (v) localStorage.setItem('domino.name', v);
      };
      nameInput.addEventListener('input', saveName);
      nameInput.addEventListener('keydown', (e) => e.key === 'Enter' && e.target.blur());
      avatar.bindPicker({ onError: () => alert(i18n.t('photoFailed')) });
      document.getElementById('newMatch').onclick = () => {
        saveName();
        const id = `${pick(words)}-${Math.floor(Math.random() * 900 + 100)}`;
        location.href = `/play/${id}`;
      };
      document.getElementById('joinForm').onsubmit = (e) => {
        e.preventDefault();
        saveName();
        let v = document.getElementById('joinId').value.trim();
        const m = v.match(/\/play\/([^/?#]+)/);
        if (m) v = m[1];
        v = v.toLowerCase().replace(/[^a-z0-9-]/g, '');
        if (v.length >= 3) location.href = `/play/${v}`;
      };
    </script>
  </body>
</html>
