<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b3a2c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>La Mesa</title>
    <meta name="description" content="Dominoes, Venezuelan truco, caída, parchís, roba la cochina or rummy for 4 players, 2 vs 2. No sign-up: send the link and play." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La Mesa" />
    <meta property="og:title" content="Come play with me at La Mesa" />
    <meta property="og:description" content="Dominoes, Venezuelan truco, caída, parchís, roba la cochina or rummy for 4 players, 2 vs 2. No sign-up: send the link and play." />
    <meta property="og:image" content="https://domino-ten-theta.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://domino-ten-theta.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A domino tile and a Spanish playing card on a green felt table, with the words La Mesa" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Paint in the last theme right away; the match's own arrives with its state. -->
    <script>document.documentElement.dataset.theme = localStorage.getItem('domino.theme') || 'felt';</script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="game">
    <div id="app">
      <header class="topbar">
        <button id="scoreBtn" class="scoreboard" aria-label="Show score history" data-i18n-aria="aria.score">
          <span class="team t0"><span class="label" id="label0">Us</span><span class="pts" id="score0">0</span></span>
          <span class="meta"><span><span data-i18n="toWord">to</span> <b id="target"></b></span><small id="roundNo">Lobby</small></span>
          <span class="team t1"><span class="pts" id="score1">0</span><span class="label" id="label1">Them</span></span>
        </button>
        <button id="menuBtn" class="icon-btn" data-menu-open aria-haspopup="menu" aria-expanded="false" aria-label="Menu" data-i18n-aria="aria.menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </header>

      <main class="table">
        <div class="seat top" id="seat-top"></div>
        <div class="seat left" id="seat-left"></div>
        <div class="seat right" id="seat-right"></div>
        <div class="board" id="board"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="mock" id="mock" role="status" aria-live="polite" hidden>
          <span class="mock-emoji" id="mockEmoji" aria-hidden="true"></span>
          <span class="mock-line" id="mockLine"></span>
        </div>
      </main>

      <footer class="hand-area">
        <div class="me-row">
          <div class="seat me" id="seat-me"></div>
          <div class="status" id="status"></div>
          <div class="me-tools">
            <button class="icon-btn small voice-btn" aria-label="Join voice chat" data-i18n-aria="aria.voiceJoin">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M18.5 11a6.5 6.5 0 01-13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
              <span class="voice-count"></span>
            </button>
            <button class="icon-btn small voice-leave" aria-label="Leave voice chat" data-i18n-aria="aria.voiceLeave" hidden>
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M2.5 14.6c5.3-5 13.7-5 19 0l-2.4 2.5a1 1 0 01-1.3.1l-2.4-1.7a1 1 0 01-.4-.9l.2-2a12.5 12.5 0 00-6.4 0l.2 2a1 1 0 01-.4.9l-2.4 1.7a1 1 0 01-1.3-.1z" fill="currentColor"/></svg>
            </button>
            <button id="reactBtn" class="icon-btn small" aria-label="Send a reaction" data-i18n-aria="aria.react" aria-haspopup="dialog" aria-expanded="false" aria-controls="reactBar" hidden>
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 007 0"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg>
            </button>
          </div>
          <div class="react-pop" id="reactBar" role="dialog" aria-label="Reactions" data-i18n-aria="aria.reactions" hidden>
            <div class="react-tabs" id="reactTabs" role="tablist"></div>
            <div class="react-grid" id="reactGrid"></div>
          </div>
        </div>
        <div class="actions" id="actions"></div>
        <div class="hand" id="hand"></div>
      </footer>
    </div>

    <!-- Lobby -->
    <section class="sheet" id="lobby" hidden>
      <div class="sheet-body lobby-body">
        <div class="sheet-head">
          <h2><span data-i18n="match">Match</span> <span id="matchCode" class="code"></span></h2>
          <div class="me-tools">
            <button class="icon-btn small voice-btn" aria-label="Join voice chat" data-i18n-aria="aria.voiceJoin">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M18.5 11a6.5 6.5 0 01-13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/></svg>
              <span class="voice-count"></span>
            </button>
            <button class="icon-btn small voice-leave" aria-label="Leave voice chat" data-i18n-aria="aria.voiceLeave" hidden>
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M2.5 14.6c5.3-5 13.7-5 19 0l-2.4 2.5a1 1 0 01-1.3.1l-2.4-1.7a1 1 0 01-.4-.9l.2-2a12.5 12.5 0 00-6.4 0l.2 2a1 1 0 01-.4.9l-2.4 1.7a1 1 0 01-1.3-.1z" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn small" data-rules aria-label="Rules" data-i18n-aria="aria.rules">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5 8 4.5 3.5 4.5v14c4.5 0 6.8.5 8.5 2 1.7-1.5 4-2 8.5-2v-14C16 4.5 13.7 5 12 6.5zM12 6.5v14"/></svg>
            </button>
            <button class="icon-btn small" data-menu-open aria-haspopup="menu" aria-expanded="false" aria-label="Menu" data-i18n-aria="aria.menu">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            </button>
          </div>
        </div>
        <div class="invite">
          <input id="inviteUrl" readonly tabindex="-1" aria-hidden="true" />
          <button id="inviteBtn" class="btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
            <span id="inviteLabel" data-i18n="inviteFriends">Invite friends</span>
          </button>
        </div>

        <div class="lobby-options">
          <div class="identity">
            <div class="photo-field">
              <button type="button" id="photoBtn" class="photo-btn" aria-label="Take a picture for your avatar" data-i18n-aria="aria.photo"><span aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>
              <button type="button" id="photoClear" class="photo-clear" aria-label="Remove your picture" data-i18n-aria="aria.photoClear" hidden>×</button>
              <input id="photoInput" type="file" accept="image/*" hidden />
            </div>
            <label class="field">
              <span data-i18n="yourName">Your name</span>
              <input id="nameInput" maxlength="24" autocomplete="nickname" enterkeyhint="done" />
            </label>
          </div>
          <button type="button" class="game-card style-card" id="styleCard" aria-haspopup="dialog"></button>
          <button type="button" class="game-card" id="gameCard" aria-haspopup="dialog"></button>
          <div class="field">
            <span data-i18n="playTo">Play to</span>
            <div class="segmented" id="targetPicker"></div>
          </div>
          <div class="field variant-field" id="variantField" hidden>
            <span data-i18n="variant"></span>
            <div class="segmented" id="variantPicker"></div>
          </div>
        </div>

        <div class="lobby-seats">
          <p class="section-title"><span data-i18n="seats">Seats</span> <small data-i18n="seatsNote">— partners sit across from each other</small></p>
          <div class="lobby-table" id="lobbySeats"></div>
        </div>

        <div class="lobby-actions">
          <button id="botsBtn" class="btn block" data-i18n="fillBots">Fill empty seats with bots</button>
          <button id="startBtn" class="btn primary block">Start game</button>
        </div>
      </div>
    </section>

    <!-- Every game the lobby can switch to -->
    <section class="sheet" id="gamesSheet" hidden>
      <div class="sheet-body">
        <div class="sheet-head">
          <h2 data-i18n="chooseGame">Choose a game</h2>
          <button class="icon-btn" data-close aria-label="Close" data-i18n-aria="aria.close">✕</button>
        </div>
        <div class="game-list" id="gameList"></div>
      </div>
    </section>

    <!-- Every style the table can take -->
    <section class="sheet" id="stylesSheet" hidden>
      <div class="sheet-body">
        <div class="sheet-head">
          <h2 data-i18n="chooseStyle">Choose a style</h2>
          <button class="icon-btn" data-close aria-label="Close" data-i18n-aria="aria.close">✕</button>
        </div>
        <div class="game-list" id="styleList"></div>
      </div>
    </section>

    <!-- Score history -->
    <section class="sheet" id="scoreSheet" hidden>
      <div class="sheet-body">
        <div class="sheet-head">
          <h2 data-i18n="score">Score</h2>
          <button class="icon-btn" data-close aria-label="Close" data-i18n-aria="aria.close">✕</button>
        </div>
        <table class="history">
          <thead>
            <tr><th>#</th><th class="c0" id="hLabel0">Us</th><th class="c1" id="hLabel1">Them</th><th data-i18n="how">How</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
          <tfoot>
            <tr><th data-i18n="total">Total</th><th class="c0" id="total0">0</th><th class="c1" id="total1">0</th><th id="totalTarget"></th></tr>
          </tfoot>
        </table>
        <p class="rules" data-i18n="rules"></p>
      </div>
    </section>

    <!-- The rules of the game on the table -->
    <section class="sheet" id="rulesSheet" hidden>
      <div class="sheet-body">
        <div class="sheet-head">
          <h2 id="rulesTitle"></h2>
          <button class="icon-btn" data-close aria-label="Close" data-i18n-aria="aria.close">✕</button>
        </div>
        <div class="rules-body" id="rulesBody"></div>
      </div>
    </section>

    <!-- Round or hand / match result -->
    <section class="overlay" id="result" hidden>
      <div class="result-card" id="resultCard">
        <div class="result-emoji" id="resultEmoji"></div>
        <h2 id="resultTitle"></h2>
        <p id="resultSub"></p>
        <div class="result-scores" id="resultScores"></div>
        <div class="result-awards" id="resultAwards"></div>
        <div class="result-hands" id="resultHands"></div>
        <div class="result-actions" id="resultActions"></div>
      </div>
      <button class="btn primary peek-btn" data-act="unpeek" data-i18n="showResult">Show result</button>
    </section>


    <!-- The ⋯ menu, from the top bar or the lobby's header -->
    <div class="menu-layer" id="menu" hidden>
      <div class="menu" role="menu" id="menuPanel">
        <button role="menuitem" data-menu="invite"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg><span data-i18n="inviteFriends">Invite friends</span></button>
        <hr />
        <button role="menuitem" data-menu="style" id="menuStyle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 005-5c0-4-4-7.2-9-7.2z"/><path d="M7.5 11h.01M10 7h.01M15 7.5h.01" stroke-width="3"/></svg><span data-i18n="tableStyle">Table style</span><small id="menuStyleName"></small></button>
        <button role="menuitem" data-menu="rules"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.3 5 8 4.5 3.5 4.5v14c4.5 0 6.8.5 8.5 2 1.7-1.5 4-2 8.5-2v-14C16 4.5 13.7 5 12 6.5zM12 6.5v14"/></svg><span data-i18n="aria.rules">Rules</span></button>
        <button role="menuitem" data-menu="lang"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span data-i18n="language">Language</span><small data-i18n="langName"></small></button>
        <button role="menuitem" data-menu="sound"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 010 6M18 6.5a8 8 0 010 11"/></svg><span data-i18n="sound">Sound</span><small id="menuSound"></small></button>
        <hr />
        <button role="menuitem" data-menu="lobby" id="menuLobby"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 5l8 6.5M6 10v9h12v-9"/></svg><span data-i18n="backToLobby">Back to the lobby</span></button>
        <a role="menuitem" href="/" class="leave"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M9 8l-4 4 4 4M5 12h11"/></svg><span data-i18n="leaveMatch">Leave match</span></a>
      </div>
    </div>

    <!-- Going back to the lobby ends the game for everyone, so it asks first -->
    <section class="overlay confirm" id="confirmLobby" hidden>
      <div class="result-card" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmText">
        <div class="result-emoji" aria-hidden="true">🏠</div>
        <h2 id="confirmTitle" data-i18n="confirmLobby.title">Back to the lobby?</h2>
        <p id="confirmText" data-i18n="confirmLobby.text"></p>
        <div class="result-actions">
          <button class="btn primary" data-close data-i18n="keepPlaying">Keep playing</button>
          <button class="btn danger" data-act="lobby" data-i18n="confirmLobby.yes">End game, back to the lobby</button>
        </div>
      </div>
    </section>

    <div class="conn" id="conn" hidden data-i18n="reconnecting">Reconnecting…</div>
    <canvas id="fx" hidden></canvas>

    <script type="module" src="/js/play.js"></script>
  </body>
</html>
